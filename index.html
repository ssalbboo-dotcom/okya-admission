<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#142b43">
  <meta name="description" content="2027학년도 창녕옥야고등학교 신입학 가이드북">
  <title>2027 창녕옥야고 신입학 가이드북</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div class="title-wrap">
      <span class="eyebrow">CHANGNYEONG OKYA HIGH SCHOOL</span>
      <h1>2027 신입학 가이드북</h1>
    </div>
    <div class="header-actions">
      <button id="zoomOut" type="button" aria-label="축소">−</button>
      <span id="zoomLabel" aria-live="polite">100%</span>
      <button id="zoomIn" type="button" aria-label="확대">+</button>
      <button id="fullscreen" type="button" aria-label="전체화면">⛶ <span>전체화면</span></button>
      <a class="download" href="./2027-okya-admission-guidebook.pdf" download>PDF 다운로드</a>
    </div>
  </header>

  <main>
    <div id="reader" class="reader" aria-label="전자책 뷰어">
      <button id="prev" class="nav prev" type="button" aria-label="이전 페이지">‹</button>
      <div id="viewport" class="viewport">
        <div id="book" class="book" aria-live="polite"></div>
      </div>
      <button id="next" class="nav next" type="button" aria-label="다음 페이지">›</button>
    </div>
  </main>

  <footer class="controls">
    <span id="pageStatus">1 / 96</span>
    <label>페이지
      <input id="pageInput" type="number" min="1" max="96" value="1" inputmode="numeric" aria-label="이동할 페이지">
    </label>
    <button id="goPage" type="button">이동</button>
    <span class="hint">키보드 ← → · 화면 스와이프</span>
  </footer>
  <noscript>이 E-book을 보려면 JavaScript를 활성화해 주세요.</noscript>
  <script src="./app.js"></script>
</body>
</html>
